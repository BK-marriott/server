name: CI/CD with github actions & docker

on:
  push:
    branches: [ "ci-cd/#38-pipeline-implementation" ]

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.get_changed_services.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 변경 사항 감지를 위해 충분한 커밋 히스토리 필요

      - name: Set up Git
        run: |
          git fetch origin ${{ github.event.before }} --depth=1

      - name: Get list of changed directories
        id: get_changed_services
        run: |
          # 변경된 파일 목록을 가져와서 상위 디렉토리(서비스명)를 추출
          CHANGED_DIRS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | awk -F/ '{print $1 "/" $2}' | sort | uniq)
          
          echo "Changed directories: $CHANGED_DIRS"
          
          # 서비스 목록 정의
          SERVICES=(
            "com.bkmarriott.auth"
            "com.bkmarriott.charge"
            "com.bkmarriott.coupon"
            "com.bkmarriott.eureka"
            "com.bkmarriott.gateway"
            "com.bkmarriott.hotel"
            "com.bkmarriott.promotion"
            "com.bkmarriott.reservation"
          )
          
          # 변경된 서비스 필터링
          CHANGED_SERVICES=()
          for SERVICE in "${SERVICES[@]}"; do
            for DIR in $CHANGED_DIRS; do
              if [[ "$DIR" == "$SERVICE/"* ]]; then
                CHANGED_SERVICES+=("$SERVICE")
                break
              fi
            done
          done
          
          # 결과 출력 (JSON 배열 형식)
          SERVICES_JSON=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -s .)
          echo "::set-output name=services::$SERVICES_JSON"
