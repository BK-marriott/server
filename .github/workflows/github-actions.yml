name: CI/CD with github actions & docker

on:
  push:
    branches: [ "ci-cd/#38-pipeline-implementation" ]

jobs:
  build-and-deploy:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: "eureka"
            folder: "com.bkmarriott.eureka"
            yml: "EUREKA_SERVER_APPLICATION_DEV_YML"
          - name: "auth"
            folder: "com.bkmarriott.auth"
            yml: "AUTH_APPLICATION_DEV_YML"
          - name: "charge"
            folder: "com.bkmarriott.charge"
            yml: "CHARGE_APPLICATION_DEV_YML"
          - name: "coupon"
            folder: "com.bkmarriott.coupon"
            yml: "COUPON_APPLICATION_DEV_YML"
          - name: "gateway"
            folder: "com.bkmarriott.gateway"
            yml: "GATEWAY_APPLICATION_DEV_YML"
          - name: "hotel"
            folder: "com.bkmarriott.hotel"
            yml: "HOTEL_APPLICATION_DEV_YML"
          - name: "promotion"
            folder: "com.bkmarriott.promotion"
            yml: "PROMOTION_APPLICATION_DEV_YML"
#          - name: "reservation"
#            folder: "com.bkmarriott.reservation"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject application.yml
        env:
          DYNAMIC_YML_SECRET: ${{ secrets['${{ matrix.service.yml }}'] }}
        run: |
          echo "$DYNAMIC_YML_SECRET" > ${{ matrix.service.folder }}/src/main/resources/application-dev.yml

      - name: Build with Gradle
        run: |
          cd ${{ matrix.service.folder }}
          ./gradlew clean 
          ./gradlew build -x test --no-daemon

      - name: Build Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          cd ${{ matrix.service.folder }}
          docker buildx build -t $DOCKER_USERNAME/bkmarriott-${{ matrix.service.name }}:latest .

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push $DOCKER_USERNAME/bkmarriott-${{ matrix.service.name }}:latest