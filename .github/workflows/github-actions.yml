name: CI/CD with github actions & docker

on:
  push:
    branches: [ "ci-cd/#38-pipeline-implementation" ]

jobs:
  build-and-deploy:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
#          - name: "auth"
#            folder: "com.bkmarriott.auth"
#          - name: "charge"
#            folder: "com.bkmarriott.charge"
          - name: "coupon"
            folder: "com.bkmarriott.coupon"
          - name: "eureka"
            folder: "com.bkmarriott.eureka"
          - name: "gateway"
            folder: "com.bkmarriott.gateway"
#          - name: "hotel"
#            folder: "com.bkmarriott.hotel"
#          - name: "promotion"
#            folder: "com.bkmarriott.promotion"
#          - name: "reservation"
#            folder: "com.bkmarriott.reservation"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject application.yml
        run: |
          echo "${{ secrets.APPLICATION_PROD_YML }}" > ${{ matrix.service.folder }}/src/main/resources/application-dev.yml

      - name: Build with Gradle
        run: |
          cd ${{ matrix.service.folder }}
          ./gradlew clean 
          ./gradlew build -x test --no-daemon

      - name: Build Docker Image
        run: |
          cd ${{ matrix.service.folder }}
          docker buildx build -t bkmarriott:${{ matrix.service.name }} .

      - name: Push Docker Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker push bkmarriott:${{ matrix.service }}